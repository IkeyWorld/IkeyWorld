<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyWorld Minecraft Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #ff6b35;
            --primary-dark: #e85a2b;
            --secondary: #4ecdc4;
            --dark: #2c3e50;
            --darker: #1a252f;
            --light: #ecf0f1;
        }

        body {
            background: linear-gradient(135deg, var(--darker), var(--dark));
            color: var(--light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 90%;
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        h1 {
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--light);
        }

        input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--light);
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 1rem;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .redirect-btn {
            background: var(--secondary);
        }

        .redirect-btn:hover {
            background: #3db8af;
        }

        .message {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 5px;
            display: none;
        }

        .success {
            background: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #2ecc71;
        }

        .error {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #e74c3c;
        }

        .server-info {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .loading {
            display: none;
            margin-top: 1rem;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-key"></i>
        </div>
        <h1>KeyWorld Minecraft</h1>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Игровой никнейм:</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="16">
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="serverIp">IP вашего сервера:</label>
                <input type="text" id="serverIp" name="serverIp" required placeholder="например: play.myserver.com">
            </div>
            
            <button type="submit">Зарегистрироваться через GitHub</button>
        </form>

        <div class="loading" id="loading">
            <div class="loader"></div>
            <p>Регистрируем аккаунт на вашем сервере...</p>
        </div>

        <div id="message" class="message"></div>

        <button class="redirect-btn" onclick="redirectToServer()">
            Перейти на сервер ›
        </button>

        <div class="server-info">
            <p><strong>Как это работает:</strong></p>
            <p>1. Заполните форму регистрации</p>
            <p>2. Данные сохранятся в GitHub</p>
            <p>3. Аккаунт создается на вашем сервере</p>
            <p>4. Получите данные для входа</p>
        </div>
    </div>

    <script>
        let currentServerIp = '';

        // Функция редиректа
        function redirectToServer() {
            if (currentServerIp) {
                window.open(`https://${currentServerIp}`, '_blank');
            } else {
                alert('Сначала зарегистрируйтесь и укажите IP сервера');
            }
        }

        // Обработка формы регистрации
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password'),
                serverIp: formData.get('serverIp'),
                timestamp: new Date().toISOString(),
                ip: await getClientIP()
            };

            currentServerIp = data.serverIp;

            // Показываем загрузку
            document.getElementById('loading').style.display = 'block';
            document.getElementById('message').style.display = 'none';

            try {
                // 1. Сохраняем в GitHub
                const githubResult = await saveToGitHub(data);
                
                if (githubResult.success) {
                    // 2. Регистрируем на сервере Minecraft
                    const serverResult = await registerOnMinecraftServer(data);
                    
                    showMessage(
                        `✅ Регистрация успешна!<br>
                         Аккаунт создан на сервере: ${data.serverIp}<br>
                         Данные сохранены в GitHub`,
                        'success'
                    );
                } else {
                    throw new Error('Ошибка сохранения в GitHub');
                }
                
            } catch (error) {
                console.error('Registration error:', error);
                showMessage('❌ Ошибка регистрации: ' + error.message, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        // Сохранение данных в GitHub
        async function saveToGitHub(playerData) {
            const githubData = {
                players: [playerData],
                last_updated: new Date().toISOString()
            };

            // В реальном проекте здесь будет вызов GitHub API
            // Для демонстрации имитируем успешное сохранение
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Сохраняем в localStorage для демонстрации
                    const existingData = JSON.parse(localStorage.getItem('githubPlayers') || '{"players":[]}');
                    existingData.players.push(playerData);
                    existingData.last_updated = new Date().toISOString();
                    localStorage.setItem('githubPlayers', JSON.stringify(existingData));
                    
                    resolve({ success: true, data: existingData });
                }, 2000);
            });
        }

        // Регистрация на сервере Minecraft
        async function registerOnMinecraftServer(playerData) {
            // Здесь должен быть вызов API вашего Minecraft сервера
            // Для демонстрации имитируем регистрацию
            
            return new Promise((resolve) => {
                setTimeout(() => {
                    // В реальном проекте:
                    // fetch(`https://${playerData.serverIp}/api/register`, {
                    //     method: 'POST',
                    //     body: JSON.stringify({
                    //         username: playerData.username,
                    //         password: playerData.password,
                    //         email: playerData.email
                    //     })
                    // });
                    
                    resolve({ 
                        success: true, 
                        message: `Аккаунт ${playerData.username} создан на сервере ${playerData.serverIp}` 
                    });
                }, 1500);
            });
        }

        // Получение IP клиента
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'unknown';
            }
        }

        // Показать сообщение
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.innerHTML = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        // Загрузка существующих данных из GitHub (для демонстрации)
        function loadExistingData() {
            const data = localStorage.getItem('githubPlayers');
            if (data) {
                console.log('Существующие данные:', JSON.parse(data));
            }
        }

        // Загружаем данные при старте
        loadExistingData();
    </script>
</body>
</html>
